org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustAllCertificates=true -Djavax.net.ssl.trustStoreType=JKS
android.useAndroidX=true

# 关闭 Gradle 守护进程（避免缓存问题）
org.gradle.daemon=false

# 网络连接配置
org.gradle.parallel=true
org.gradle.configureondemand=true

